{% load static %}
<html>
    <head>
        <title>Product Insert</title>
    </head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style2.css' %}">
    <body>
    <center>        
            <h1>Product Insert</h1>
    <div class="container">
    <form method="get">
        Enter Id:<input type="text" name="txtid" placeholder="id" required><br>
        Enter Name:<input type="text" name="txtname" placeholder="name" required><br>
        Enter Description:<input type="text" name="txtdesc" placeholder="description" required><br>
        Enter Price:<input type="text" name="txtprice" placeholder="price" required><br>
        <button type="submit" class="btn btn-primary">Insert</button>
        {{result}}
    </form>
    </div>
     </center>
    </body>
</html>
